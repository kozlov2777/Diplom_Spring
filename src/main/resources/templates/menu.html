<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню ресторану</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .nav-tabs {
            border-bottom: 2px solid #667eea;
            margin-bottom: 25px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #666;
            font-weight: 600;
            font-size: 16px;
            padding: 12px 25px;
            transition: all 0.3s;
        }
        .nav-tabs .nav-link:hover {
            border: none;
            color: #667eea;
        }
        .nav-tabs .nav-link.active {
            border: none;
            border-bottom: 3px solid #667eea;
            color: #667eea;
            background: transparent;
        }
        .menu-item {
            transition: all 0.3s;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: #f8f9fa;
        }
        .item-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 18px;
        }
        .item-price {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        .item-calories {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .category-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
        }
        .filter-tabs {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .filter-btn {
            border-radius: 25px;
            padding: 10px 25px;
            margin: 5px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #667eea;
            color: white;
        }
        .category-section {
            margin-bottom: 40px;
        }
        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-header:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .category-header h3 {
            margin: 0;
            font-weight: 700;
        }
        .category-count {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .dish-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }
        .dish-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        .dish-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .dish-description {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .dish-price {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        .stats-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stats-card h3 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
        }
        .stats-card p {
            margin: 5px 0 0 0;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div th:replace="~{navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="section-header">
        <h1>🍽️ Меню ресторану</h1>
        <p class="mb-0">Всі доступні страви та напої</p>
    </div>

    <!-- Вкладки -->
    <ul class="nav nav-tabs" id="menuTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="table-tab" data-toggle="tab" href="#table" role="tab">
                📋 Таблиця меню
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="categories-tab" data-toggle="tab" href="#categories" role="tab">
                📂 За категоріями
            </a>
        </li>
    </ul>

    <div class="tab-content" id="menuTabsContent">
        <!-- Вкладка таблиці -->
        <div class="tab-pane fade show active" id="table" role="tabpanel">
            <div class="filter-tabs">
                <div class="row">
                    <div class="col-md-8">
                        <div id="categoryFilters">
                            <button class="filter-btn active" data-category="all">Всі</button>
                            <!-- Категорії будуть додані динамічно -->
                        </div>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="searchMenu" class="form-control" placeholder="🔍 Пошук страв...">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="menuTable">
                        <thead>
                            <tr>
                                <th width="5%">#</th>
                                <th width="20%">Назва</th>
                                <th width="30%">Опис</th>
                                <th width="10%">Ціна</th>
                                <th width="15%">Категорія</th>
                                <th width="10%">Калорії</th>
                                <th width="10%">Деталі</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="menu-item" th:each="m : ${menu}" th:data-category="${m.category}">
                                <td th:text="${m.id}"></td>
                                <td>
                                    <div class="item-name" th:text="${m.name}"></div>
                                </td>
                                <td>
                                    <small class="text-muted" th:text="${m.description}"></small>
                                </td>
                                <td>
                                    <span class="item-price" th:text="${m.price + ' грн'}"></span>
                                </td>
                                <td>
                                    <span class="category-badge" th:text="${m.category}"></span>
                                </td>
                                <td>
                                    <span class="item-calories" th:text="${m.totalCalories + ' ккал'}"></span>
                                </td>
                                <td>
                                    <a th:href="@{'/item_detail/' + ${m.id}}" class="btn btn-sm btn-primary">
                                        Інфо →
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="noResultsTable" style="display:none;" class="text-center py-5">
                <h4 class="text-muted">Страви не знайдено</h4>
            </div>
        </div>

        <!-- Вкладка категорій -->
        <div class="tab-pane fade" id="categories" role="tabpanel">
            <!-- Статистика -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 class="text-primary" id="totalCategories">-</h3>
                        <p>Категорій</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 class="text-success" id="totalDishes">-</h3>
                        <p>Всього страв</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 class="text-info" id="avgPrice">-</h3>
                        <p>Середня ціна</p>
                    </div>
                </div>
            </div>

            <!-- Пошук -->
            <div class="card mb-4">
                <div class="card-body">
                    <input type="text" id="searchDish" class="form-control" placeholder="🔍 Пошук страв...">
                </div>
            </div>

            <!-- Категорії та страви -->
            <div id="categoriesContainer"></div>

            <div id="noResultsCategories" style="display:none;" class="text-center py-5">
                <h4 class="text-muted">Страви не знайдено</h4>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script th:inline="javascript">
// === ВКЛАДКА ТАБЛИЦІ ===
// Збираємо унікальні категорії
const categories = new Set();
$('.menu-item').each(function() {
    categories.add($(this).data('category'));
});

// Додаємо кнопки фільтрів
categories.forEach(category => {
    $('#categoryFilters').append(`
        <button class="filter-btn" data-category="${category}">${category}</button>
    `);
});

// Фільтрація за категорією
$('.filter-btn').click(function() {
    $('.filter-btn').removeClass('active');
    $(this).addClass('active');
    
    const category = $(this).data('category');
    
    if (category === 'all') {
        $('.menu-item').show();
    } else {
        $('.menu-item').each(function() {
            $(this).toggle($(this).data('category') === category);
        });
    }
    
    checkTableResults();
});

// Пошук в таблиці
$('#searchMenu').on('input', function() {
    const search = $(this).val().toLowerCase();
    
    $('.menu-item').each(function() {
        const text = $(this).text().toLowerCase();
        $(this).toggle(text.includes(search));
    });
    
    checkTableResults();
});

function checkTableResults() {
    const hasVisible = $('.menu-item:visible').length > 0;
    $('#noResultsTable').toggle(!hasVisible);
    $('#menuTable').toggle(hasVisible);
}

// === ВКЛАДКА КАТЕГОРІЙ ===
const categoryData = /*[[${category}]]*/ [];

// Групування за категоріями
const grouped = {};
categoryData.forEach(item => {
    const catName = item.category_name;
    if (!grouped[catName]) {
        grouped[catName] = [];
    }
    grouped[catName].push(item);
});

// Відображення категорій
let html = '';
for (let catName in grouped) {
    const dishes = grouped[catName];
    html += `
        <div class="category-section">
            <div class="category-header" onclick="toggleCategory(this)">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>${catName}</h3>
                    <span class="category-count">${dishes.length} ${dishes.length === 1 ? 'страва' : 'страв'}</span>
                </div>
            </div>
            <div class="category-dishes">
    `;
    
    dishes.forEach(dish => {
        html += `
            <div class="dish-card" data-name="${dish.menu_item_name}">
                <div class="row align-items-center">
                    <div class="col-md-1 text-center">
                        <strong class="text-muted">#${dish.menu_item_id}</strong>
                    </div>
                    <div class="col-md-6">
                        <div class="dish-name">${dish.menu_item_name}</div>
                        <div class="dish-description">${dish.description || 'Без опису'}</div>
                    </div>
                    <div class="col-md-3 text-center">
                        <div class="dish-price">${dish.price} грн</div>
                    </div>
                    <div class="col-md-2 text-right">
                        <a href="/item_detail/${dish.menu_item_id}" class="btn btn-sm btn-primary">Деталі</a>
                    </div>
                </div>
            </div>
        `;
    });
    
    html += `
            </div>
        </div>
    `;
}

$('#categoriesContainer').html(html);

// Підрахунок статистики
const totalCategories = Object.keys(grouped).length;
const totalDishes = categoryData.length;
const avgPrice = categoryData.length > 0 
    ? (categoryData.reduce((sum, item) => sum + parseFloat(item.price), 0) / totalDishes).toFixed(2)
    : 0;

$('#totalCategories').text(totalCategories);
$('#totalDishes').text(totalDishes);
$('#avgPrice').text(avgPrice + ' грн');

// Згортання/розгортання категорій
function toggleCategory(header) {
    const dishes = $(header).next('.category-dishes');
    dishes.slideToggle(300);
}

// Пошук в категоріях
$('#searchDish').on('input', function() {
    const search = $(this).val().toLowerCase();
    let hasResults = false;
    
    $('.dish-card').each(function() {
        const name = $(this).data('name').toLowerCase();
        const visible = name.includes(search);
        $(this).toggle(visible);
        if (visible) hasResults = true;
    });
    
    // Показуємо лише категорії з видимими стравами
    $('.category-section').each(function() {
        const hasVisible = $(this).find('.dish-card:visible').length > 0;
        $(this).toggle(hasVisible);
    });
    
    $('#noResultsCategories').toggle(!hasResults);
});
</script>
</body>
</html>
