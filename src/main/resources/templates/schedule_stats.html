<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Статистика графіку</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stats-table { font-size: 14px; }
        .stats-table th { background-color: #343a40; color: white; }
    </style>
</head>
<body>
<div th:replace="~{navbar}"></div>
<div class="container mt-5">
    <h2 class="text-center mb-4">Статистика роботи працівників</h2>
    
    <div class="row justify-content-center">
        <div class="col-md-10">
            <a href="/schedule" class="btn btn-secondary mb-3">← Назад до графіку</a>
            
            <!-- Фільтр по датах -->
            <div class="card mb-3">
                <div class="card-body">
                    <form th:action="@{/schedule/stats}" method="get" class="form-inline">
                        <label class="mr-2">Період:</label>
                        <input type="date" name="startDate" th:value="${startDate}" class="form-control mr-2" required>
                        <label class="mr-2">-</label>
                        <input type="date" name="endDate" th:value="${endDate}" class="form-control mr-2" required>
                        <button type="submit" class="btn btn-primary">Показати</button>
                    </form>
                </div>
            </div>

            <!-- Таблиця статистики -->
            <table class="table table-bordered stats-table">
                <thead>
                    <tr>
                        <th>Працівник</th>
                        <th>Робочих днів</th>
                        <th>Вихідних</th>
                        <th>Всього годин (приблизно)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="stat : ${stats}">
                        <td th:text="${stat.firstName + ' ' + stat.lastName}"></td>
                        <td th:text="${stat.workDaysCount}"></td>
                        <td th:text="${stat.daysOffCount}"></td>
                        <td th:text="${stat.workDaysCount * 8}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(stats)}">
                        <td colspan="4" class="text-center">Немає даних за вибраний період</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
