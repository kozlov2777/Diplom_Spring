<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список замовлень</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .order-card {
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }
        .order-card:hover {
            border-left-color: #764ba2;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        .order-id {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .order-total {
            font-size: 22px;
            font-weight: bold;
            color: #43e97b;
        }
        .filter-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
<div th:replace="~{navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="section-header">
        <h1>📋 Список замовлень</h1>
        <p class="mb-0">Перегляд всіх замовлень ресторану</p>
    </div>

    <div class="filter-bar">
        <div class="row align-items-center">
            <div class="col-md-6">
                <input type="text" id="searchOrder" class="form-control" placeholder="🔍 Пошук за номером столика або ID...">
            </div>
            <div class="col-md-6 text-right">
                <a href="/new_order" class="btn btn-primary">
                    ➕ Створити замовлення
                </a>
            </div>
        </div>
    </div>

    <div class="row" id="ordersList">
        <div class="col-md-6 col-lg-4 mb-4" th:each="o : ${orderList}">
            <div class="card order-card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <span class="text-muted">Замовлення</span>
                            <div class="order-id">#<span th:text="${o.id}"></span></div>
                        </div>
                        <span class="badge badge-info">Столик <span th:text="${o.tableNumber}"></span></span>
                    </div>
                    
                    <div class="mb-3">
                        <small class="text-muted">📅 Дата створення</small>
                        <div th:text="${o.createdAt}"></div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-muted">Сума</small>
                            <div class="order-total"><span th:text="${o.total}"></span> грн</div>
                        </div>
                        <a th:href="@{'order_detail/' + ${o.id}}" class="btn btn-primary">
                            Деталі →
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="noResults" style="display:none;" class="text-center py-5">
        <h4 class="text-muted">Замовлення не знайдено</h4>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
// Пошук замовлень
$('#searchOrder').on('input', function() {
    const search = $(this).val().toLowerCase();
    let hasResults = false;
    
    $('.order-card').closest('.col-md-6').each(function() {
        const text = $(this).text().toLowerCase();
        const visible = text.includes(search);
        $(this).toggle(visible);
        if (visible) hasResults = true;
    });
    
    $('#noResults').toggle(!hasResults);
});
</script>
</body>
</html>
