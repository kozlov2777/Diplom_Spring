<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управління інвентарем</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .low-stock { background-color: #f8d7da; }
        .normal-stock { background-color: #d4edda; }
    </style>
</head>
<body>
<div th:replace="~{navbar}"></div>
<div class="container mt-4">
    <h2>📦 Управління інвентарем</h2>
    
    <div class="alert alert-danger" th:if="${ingredients.stream().filter(i -> i.isLowStock).count() > 0}">
        <strong>⚠️ Увага!</strong> <span th:text="${ingredients.stream().filter(i -> i.isLowStock).count()} + ' продуктів з низьким запасом!'"></span>
    </div>
    
    <a href="/inventory/purchases" class="btn btn-primary mb-3">📋 Історія закупівель</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Інгредієнт</th>
                <th>Поточна кількість</th>
                <th>Одиниця</th>
                <th>Мінімум</th>
                <th>Статус</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ing : ${ingredients}" th:classappend="${ing.isLowStock ? 'low-stock' : 'normal-stock'}">
                <td th:text="${ing.name}"></td>
                <td th:text="${ing.quantity}"></td>
                <td th:text="${ing.unit}"></td>
                <td th:text="${ing.minQuantity}"></td>
                <td>
                    <span th:if="${ing.isLowStock}" class="badge badge-danger">Низький запас!</span>
                    <span th:if="${!ing.isLowStock}" class="badge badge-success">OK</span>
                </td>
                <td>
                    <button class="btn btn-sm btn-warning" th:onclick="'editIngredient(' + ${ing.id} + ', \'' + ${ing.name} + '\', ' + ${ing.quantity} + ', ' + ${ing.minQuantity} + ')'">Редагувати</button>
                    <button class="btn btn-sm btn-primary" th:onclick="'addPurchase(' + ${ing.id} + ', \'' + ${ing.name} + '\', \'' + ${ing.unit} + '\')'">Закупити</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Модальне вікно редагування -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/inventory/update" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editTitle"></h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editId">
                    <div class="form-group">
                        <label>Поточна кількість:</label>
                        <input type="number" step="0.01" name="quantity" id="editQuantity" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Мінімальний залишок:</label>
                        <input type="number" step="0.01" name="minQuantity" id="editMinQuantity" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Зберегти</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Скасувати</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальне вікно закупівлі -->
<div class="modal fade" id="purchaseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/inventory/purchase" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="purchaseTitle"></h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="ingredientId" id="purchaseId">
                    <input type="hidden" name="employeeId" value="1">
                    <div class="form-group">
                        <label>Кількість:</label>
                        <input type="number" step="0.01" name="quantity" class="form-control" required>
                        <small id="purchaseUnit"></small>
                    </div>
                    <div class="form-group">
                        <label>Ціна (грн):</label>
                        <input type="number" step="0.01" name="price" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Додати закупівлю</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Скасувати</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
function editIngredient(id, name, quantity, minQuantity) {
    $('#editTitle').text('Редагувати: ' + name);
    $('#editId').val(id);
    $('#editQuantity').val(quantity);
    $('#editMinQuantity').val(minQuantity);
    $('#editModal').modal('show');
}

function addPurchase(id, name, unit) {
    $('#purchaseTitle').text('Закупівля: ' + name);
    $('#purchaseId').val(id);
    $('#purchaseUnit').text('Одиниця: ' + unit);
    $('#purchaseModal').modal('show');
}
</script>
</body>
</html>
