<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категорії страв</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .category-section {
            margin-bottom: 40px;
        }
        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-header:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .category-header h3 {
            margin: 0;
            font-weight: 700;
        }
        .category-count {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .dish-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }
        .dish-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        .dish-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .dish-description {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .dish-price {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
<div th:replace="~{navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="section-header">
        <h1>📂 Категорії страв</h1>
        <p class="mb-0">Меню згруповане за категоріями</p>
    </div>

    <!-- Статистика -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h3 class="text-primary" id="totalCategories">-</h3>
                    <p class="text-muted mb-0">Категорій</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h3 class="text-success" id="totalDishes">-</h3>
                    <p class="text-muted mb-0">Всього страв</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h3 class="text-info" id="avgPrice">-</h3>
                    <p class="text-muted mb-0">Середня ціна</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Пошук -->
    <div class="card mb-4">
        <div class="card-body">
            <input type="text" id="searchDish" class="form-control" placeholder="🔍 Пошук страв...">
        </div>
    </div>

    <!-- Категорії та страви -->
    <div id="categoriesContainer"></div>

    <div id="noResults" style="display:none;" class="text-center py-5">
        <h4 class="text-muted">Страви не знайдено</h4>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script th:inline="javascript">
// Дані з Thymeleaf
const categoryData = /*[[${category}]]*/ [];

// Групування за категоріями
const grouped = {};
categoryData.forEach(item => {
    const catName = item.category_name;
    if (!grouped[catName]) {
        grouped[catName] = [];
    }
    grouped[catName].push(item);
});

// Відображення категорій
let html = '';
for (let catName in grouped) {
    const dishes = grouped[catName];
    html += `
        <div class="category-section">
            <div class="category-header" onclick="toggleCategory(this)">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>${catName}</h3>
                    <span class="category-count">${dishes.length} ${dishes.length === 1 ? 'страва' : 'страв'}</span>
                </div>
            </div>
            <div class="category-dishes">
    `;
    
    dishes.forEach(dish => {
        html += `
            <div class="dish-card" data-name="${dish.menu_item_name}">
                <div class="row align-items-center">
                    <div class="col-md-1 text-center">
                        <strong class="text-muted">#${dish.id}</strong>
                    </div>
                    <div class="col-md-6">
                        <div class="dish-name">${dish.menu_item_name}</div>
                        <div class="dish-description">${dish.description || 'Без опису'}</div>
                    </div>
                    <div class="col-md-3 text-center">
                        <div class="dish-price">${dish.price} грн</div>
                    </div>
                    <div class="col-md-2 text-right">
                        <a href="/item_detail/${dish.id}" class="btn btn-sm btn-primary">Деталі</a>
                    </div>
                </div>
            </div>
        `;
    });
    
    html += `
            </div>
        </div>
    `;
}

$('#categoriesContainer').html(html);

// Підрахунок статистики
const totalCategories = Object.keys(grouped).length;
const totalDishes = categoryData.length;
const avgPrice = (categoryData.reduce((sum, item) => sum + parseFloat(item.price), 0) / totalDishes).toFixed(2);

$('#totalCategories').text(totalCategories);
$('#totalDishes').text(totalDishes);
$('#avgPrice').text(avgPrice + ' грн');

// Згортання/розгортання категорій
function toggleCategory(header) {
    const dishes = $(header).next('.category-dishes');
    dishes.slideToggle(300);
}

// Пошук
$('#searchDish').on('input', function() {
    const search = $(this).val().toLowerCase();
    let hasResults = false;
    
    $('.dish-card').each(function() {
        const name = $(this).data('name').toLowerCase();
        const visible = name.includes(search);
        $(this).toggle(visible);
        if (visible) hasResults = true;
    });
    
    // Показуємо лише категорії з видимими стравами
    $('.category-section').each(function() {
        const hasVisible = $(this).find('.dish-card:visible').length > 0;
        $(this).toggle(hasVisible);
    });
    
    $('#noResults').toggle(!hasResults);
});
</script>
</body>
</html>
